<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session 3 - Forms & Inputs</title>
</head>

<body>

    <h1>Session 3: Forms & Inputs</h1>


    <!-- =====================================================
         TASK 1 & TASK 2
         PRODUCT REVIEW FORM
         ===================================================== -->

    <h2>Product Review Form</h2>

    <!--
        action="" means the form will submit to the current page.
        method="POST" means the form data will be sent using POST.
    -->
    <form action="" method="POST">

        <!-- Username -->
        <label for="username">Username:</label>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username"
            required
        >

        <br><br>

        <!-- Rating -->
        <label for="rating">Rating:</label>

        <select id="rating" name="rating" required>

            <!--
                Disabled and selected option.
                User must select an actual rating.
            -->
            <option value="" disabled selected>
                Select Rating
            </option>

            <option value="1">1 - Very Bad</option>
            <option value="2">2 - Bad</option>
            <option value="3">3 - Average</option>
            <option value="4">4 - Good</option>
            <option value="5">5 - Excellent</option>

        </select>

        <br><br>

        <!-- Review -->
        <label for="review">Your Review:</label>
        <br>

        <textarea
            id="review"
            name="review"
            rows="6"
            cols="50"
            placeholder="Write your review..."
            minlength="20"
            required
        ></textarea>

        <br><br>

        <!-- Submit Review Button -->
        <button type="submit">Submit Review</button>

    </form>


    <hr>


    <!-- =====================================================
         TASK 4 & TASK 5
         FOOD ORDER FORM
         ===================================================== -->

    <h2>Food Order Form</h2>

    <form action="" method="POST">

        <!--
            ORDER ID

            This field is disabled because the Order ID is
            generated by the system and users should not be
            allowed to change it.

            IMPORTANT:
            Disabled fields are NOT included in POST data.
        -->
        <label for="orderId">Order ID:</label>

        <input
            type="text"
            id="orderId"
            name="orderId"
            value="ORD12345"
            disabled
        >

        <br><br>


        <!-- User Name -->
        <label for="foodUserName">User Name:</label>

        <input
            type="text"
            id="foodUserName"
            name="foodUserName"
            placeholder="Enter your name"
            required
        >

        <br><br>


        <!-- Food Item -->
        <label for="foodItem">Select Food Item:</label>

        <select
            id="foodItem"
            name="foodItem"
            required
        >

            <!-- Default unselectable option -->
            <option value="" disabled selected>
                Select Food Item
            </option>

            <option value="pizza">Pizza</option>
            <option value="burger">Burger</option>
            <option value="biryani">Biryani</option>
            <option value="sandwich">Sandwich</option>

        </select>

        <br><br>


        <!-- Quantity -->
        <label for="quantity">Quantity:</label>

        <input
            type="number"
            id="quantity"
            name="quantity"
            min="1"
            required
        >

        <br><br>


        <!-- Delivery Instructions -->
        <label for="instructions">
            Delivery Instructions:
        </label>

        <br>

        <textarea
            id="instructions"
            name="instructions"
            rows="5"
            cols="50"
            placeholder="Example: Please deliver near the main gate."
            required
        ></textarea>

        <br><br>


        <!-- Place Order Button -->
        <button type="submit">Place Order</button>

    </form>


</body>
</html>
